# Levanta PostgreSQL y la app:   docker compose up --build
# Solo la base (para correr la app desde IntelliJ):   docker compose up -d postgres

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviews}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reviews
      SPRING_DATASOURCE_USERNAME: reviews
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reviews}
      # Se toma de la variable de entorno de tu máquina; nunca se escribe en este archivo.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "${APP_PORT:-8081}:8081"

  # Automatizaciones: http://localhost:5678
  # Importar el flujo:  docker compose exec n8n n8n import:workflow --input=/workflows/weekly-digest.json
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.6
    depends_on:
      - app
    environment:
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      # El flujo lee la URL del webhook con $env.DISCORD_WEBHOOK_URL, así nunca queda guardada en el JSON del repo.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  postgres-data:
  n8n-data:
