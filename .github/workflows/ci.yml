name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Incluye los tests de integración: Testcontainers usa el Docker que ya trae el runner.
      # No hace falta ANTHROPIC_API_KEY porque el clasificador está mockeado.
      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t steam-review-insights .
