spring.application.name=steam-review-insights
server.port=8081

# Base de datos local (H2 en archivo). En la semana 3 se reemplaza por PostgreSQL con Docker.
spring.datasource.url=jdbc:h2:file:./data/reviews
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Steam
app.steam.base-url=https://store.steampowered.com
app.steam.app-id=2748340
spring.jpa.open-in-view=false

# Clasificación con Claude (la API key se lee de la variable de entorno ANTHROPIC_API_KEY)
app.classifier.model=claude-haiku-4-5
app.classifier.batch-size=20
app.classifier.max-text-chars=2000
