spring.application.name=steam-review-insights
server.port=8081

# PostgreSQL. Para desarrollo local: docker compose up -d postgres
# En Docker Compose estos valores se reemplazan con las variables SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/reviews
spring.datasource.username=reviews
spring.datasource.password=${POSTGRES_PASSWORD:reviews}
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration);
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate

# Steam
app.steam.base-url=https://api.steampowered.com
app.steam.max-retries=3
app.steam.retry-backoff=2s
app.steam.app-id=2748340
spring.jpa.open-in-view=false

# Clasificación con Claude (la API key se lee de la variable de entorno ANTHROPIC_API_KEY)
app.classifier.model=claude-haiku-4-5
app.classifier.batch-size=20
app.classifier.max-text-chars=2000
